name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: css-variable-lsp
            asset_name: css-variable-lsp-linux-x86_64
            asset_path: ./css-variable-lsp-linux-x86_64.tar.gz
            asset_ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: css-variable-lsp
            asset_name: css-variable-lsp-linux-aarch64
            asset_path: ./css-variable-lsp-linux-aarch64.tar.gz
            asset_ext: tar.gz
            use_cross: true
            install_strip: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: css-variable-lsp
            asset_name: css-variable-lsp-macos-x86_64
            asset_path: ./css-variable-lsp-macos-x86_64.tar.gz
            asset_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: css-variable-lsp
            asset_name: css-variable-lsp-macos-aarch64
            asset_path: ./css-variable-lsp-macos-aarch64.tar.gz
            asset_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: css-variable-lsp.exe
            asset_name: css-variable-lsp-windows-x86_64.exe
            asset_path: ./css-variable-lsp-windows-x86_64.exe.zip
            asset_ext: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: css-variable-lsp.exe
            asset_name: css-variable-lsp-windows-aarch64.exe
            asset_path: ./css-variable-lsp-windows-aarch64.exe.zip
            asset_ext: zip
            msvc_arch: amd64_arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configure MSVC for ARM64
        if: runner.os == 'Windows' && matrix.msvc_arch
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install strip tool (Linux ARM64)
        if: runner.os == 'Linux' && matrix.install_strip == true
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Install cross (for cross targets)
        if: matrix.use_cross == true
        run: cargo install cross --locked

      - name: Build release binary (cross)
        if: matrix.use_cross == true
        run: cross build --release --target ${{ matrix.target }}

      - name: Build release binary
        if: matrix.use_cross != true
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          tar czf ${{ matrix.asset_name }}.tar.gz -C target/${{ matrix.target }}/release ${{ matrix.artifact_name }}

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path target\${{ matrix.target }}\release\${{ matrix.artifact_name }} -DestinationPath ${{ matrix.asset_name }}.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_path }}
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
