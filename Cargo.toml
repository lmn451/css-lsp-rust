[package]
name = "css-variable-lsp"
version = "0.3.8"
edition = "2021"
rust-version = "1.97"
authors = ["lmn451"]
description = "A fast, Rust-based Language Server Protocol implementation for CSS Variables"
license = "GPL-3.0"
readme = "README.md"
homepage = "https://github.com/lmn451/css-lsp-rust"
repository = "https://github.com/lmn451/css-lsp-rust"
keywords = ["lsp", "language-server", "css", "variables", "editor"]
categories = ["development-tools", "command-line-utilities"]
exclude = [
    "FEATURE_COMPARISON.md",
    "IMPLEMENTATION_STATUS.md",
    "IMPROVEMENTS_SUMMARY.md",
    "PHASE2_COMPLETE.md",
    "PHASE3_COMPLETE.md",
    "TEST_ADDITIONS_SUMMARY.md",
    "CHANGELOG.md",
    "AGENTS.md",
    "TEST_EXAMPLE.*",
    ".pi/**",
    "logs/**"
]

[lib]
name = "css_variable_lsp"
path = "src/lib.rs"

[[bin]]
name = "css-variable-lsp"
path = "src/main.rs"

[dependencies]
# LSP framework
tower-lsp-server = "0.23"
ls-types = "0.0.6"

# Async runtime
tokio = { version = "1.54.1", features = ["full"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Filesystem and globbing
globset = "0.4.21"
walkdir = "2.5"

# Color parsing
csscolorparser = "0.9"

# Path handling
pathdiff = "0.2"
url = "2.5"

# Logging (optional, for debugging)
tracing = "0.1"
tracing-subscriber = "0.3"
regex = "1.13.1"
# Keep the Oxc parser, AST, visitors, allocator, and spans on the same release.
oxc_allocator = "=0.157.0"
oxc_ast = "=0.157.0"
oxc_ast_visit = "=0.157.0"
oxc_parser = "=0.157.0"
oxc_span = "=0.157.0"

[dev-dependencies]
futures = "0.3.34"
tower = { version = "0.5", features = ["util"] }
