[package]
name = "css-variable-lsp"
version = "0.2.0"
edition = "2021"
authors = ["lmn451"]
description = "A fast, Rust-based Language Server Protocol implementation for CSS Variables"
license = "GPL-3.0"
readme = "README.md"
homepage = "https://github.com/lmn451/css-lsp-rust"
repository = "https://github.com/lmn451/css-lsp-rust"
keywords = ["lsp", "language-server", "css", "variables", "editor"]
categories = ["development-tools", "command-line-utilities"]
exclude = [
    "FEATURE_COMPARISON.md",
    "IMPLEMENTATION_STATUS.md",
    "IMPROVEMENTS_SUMMARY.md",
    "PHASE2_COMPLETE.md",
    "PHASE3_COMPLETE.md",
    "TEST_ADDITIONS_SUMMARY.md",
    "CHANGELOG.md",
    "AGENTS.md",
    "TEST_EXAMPLE.*"
]

[lib]
name = "css_variable_lsp"
path = "src/lib.rs"

[[bin]]
name = "css-variable-lsp"
path = "src/main.rs"

[dependencies]
# LSP framework
tower-lsp-server = "0.23"
ls-types = "0.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Filesystem and globbing
globset = "0.4"
walkdir = "2.4"

# Color parsing
csscolorparser = "0.6"

# Path handling
pathdiff = "0.2"
url = "2.5"

# Logging (optional, for debugging)
tracing = "0.1"
tracing-subscriber = "0.3"
regex = "1.10"

[dev-dependencies]
futures = "0.3"
tower = { version = "0.4", features = ["util"] }
tempfile = "3.13"
